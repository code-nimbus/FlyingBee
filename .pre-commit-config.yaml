repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    #Ruff version
    rev: v0.12.7
    hooks:
      #Run the linter
      - id: ruff-check
        args: [ --fix ] 
      #Run the formatter
      - id: ruff-format

  - repo: https://github.com/christophmeissner/pytest-pre-commit
    #Ruff version
    rev: 1.0.0
    hooks:
      #Run the linter
      - id: pytest
        pass_filenames: false
        always_run: true 
      


  
